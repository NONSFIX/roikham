<style>
  :root{
    --lacquer:#0e0a08; --ink:#1a110c; --ink-2:#2a1c14;
    --gold:#e4b75a; --gold-hi:#f0d082; --gold-lo:#9c7330;
    --parch:#f6edd8; --parch-2:#e9dcbd; --parch-dim:#c9bda3;
    --verm:#c23a26; --ink-text:#24180f; --ink-soft:#5b4733;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --gutter:clamp(16px,4vw,56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--lacquer);color:var(--parch);font-family:Anuphan,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  html.locked,html.locked body{overflow:hidden;height:100%;overscroll-behavior:none}
  ::selection{background:var(--gold);color:var(--lacquer)}
  a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
  :focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:2px}
  html{scrollbar-color:var(--gold-lo) var(--lacquer)}
  img{display:block}

  /* ---------- frame ---------- */
  .bar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:14px var(--gutter);color:var(--parch)}
  body[data-tone=light] .bar{color:#2e2620}
  /* the footer scrolls under the fixed bar: give the bar the page colour there */
  body[data-scene=footer] .bar{background:var(--lacquer);box-shadow:0 6px 14px 4px var(--lacquer)}
  .mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px}
  .mark .icon{width:30px;height:30px}
  /* the wordmark PNG carries glow padding; these margins crop it to the letters (measured ink box) */
  .wm{display:block;line-height:0}
  .wm img{width:123.4%;max-width:none;height:auto;margin:-12.8% 0 -11.8% -11.9%}
  .mark .wm{width:92px;overflow:hidden;transition:opacity .2s,width .2s}
  body[data-scene=hero] .mark .wm{opacity:0;width:0}
  .tag{font-size:12px;font-weight:700;color:var(--lacquer);background:var(--gold);padding:2px 8px 1px;border-radius:2px}
  .lang{font:inherit;font-size:13px;font-weight:600;color:inherit;background:none;border:1px solid currentColor;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px}
  .lang:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
  .index{position:fixed;right:calc(var(--gutter) - 8px);top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
  .index button{width:24px;height:24px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
  .index button::before{content:"";width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold);transition:background .2s,transform .2s}
  .index button.on::before{background:var(--gold);transform:rotate(45deg) scale(1.35)}
  body[data-tone=light] .index button::before{border-color:#6b5a4a}
  body[data-tone=light] .index button.on::before{background:#b8400f;border-color:#b8400f}
  .cue{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--parch-dim);transition:opacity .3s;pointer-events:none}
  body[data-tone=light] .cue{color:#6b5a4a}
  .cue svg{width:14px;height:14px}

  /* ---------- stage ---------- */
  .stage{position:relative;height:100vh;height:100dvh;overflow:hidden;perspective:1200px}
  .scene{position:absolute;inset:0;will-change:transform,filter;overflow:hidden}
  .scene:not(.on){display:none !important}
  .streak{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(90deg,#fff0 0 38px,#ffffff14 38px 40px,#00000024 40px 90px)}
  .rule{position:absolute;inset:10px;pointer-events:none;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);z-index:6}
  .rule::after{content:"";position:absolute;inset:4px;border:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}
  .plate{position:absolute;inset:-16px;background:center/cover no-repeat;filter:blur(5px)} /* soft backgrounds (owner 2026-11-14); inset hides the blurred edge */
  .h2{font-family:Chonburi,serif;font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.15;color:var(--gold-hi);text-wrap:balance;text-shadow:0 4px 18px #000b}

  /* ---------- hero: the game's main menu ---------- */
  .s-hero .plate{background-position:62% center}
  .s-hero .shade{position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg,#0e0a08f2 0%,#0e0a08d9 28%,#0e0a0866 48%,#0e0a0800 64%),linear-gradient(0deg,#0e0a08 0%,#0e0a0800 22%)}
  .s-hero .plate{filter:blur(5px) brightness(.9)}
  /* the game's hero cards (roi-kham-cards .fan-card), side by side, not stacked (owner 2026-11-14) */
  .fan{position:absolute;z-index:2;top:14%;bottom:12%;right:7%;width:54%;pointer-events:none;container-type:size;display:flex;justify-content:center;align-items:center;gap:3cqw}
  .fan-card{flex:none;width:min(30cqw,66cqh);aspect-ratio:4/5.6;display:flex;flex-direction:column;overflow:hidden;
    border-radius:10px;background:var(--lacquer);border:2px solid color-mix(in srgb,var(--hue) 70%,var(--gold));box-shadow:0 20px 40px #000c;
    translate:0 calc((1 - var(--i) * var(--i)) * -5%);rotate:calc(var(--i) * 3deg)}
  .fan-card img{flex:1;width:100%;min-height:0;object-fit:cover;object-position:50% 10%}
  .fan-card b{flex:none;padding:6px 14px 9px;font-family:Chonburi,serif;font-weight:400;font-size:clamp(18px,1.6vw,24px);line-height:1.3;color:var(--gold);background:var(--lacquer);border-top:1px solid #e4b75a55;text-align:center}
  .menu{position:absolute;z-index:3;left:var(--gutter);top:50%;transform:translateY(-50%);width:min(440px,40vw)}
  .logo{width:min(400px,100%)}
  .logo img{width:100%;height:auto;filter:drop-shadow(0 8px 24px #000c)}
  .pitch{margin-top:12px;font-size:clamp(18px,1.8vw,22px);font-weight:600;color:var(--parch)}
  .items{list-style:none;margin-top:clamp(24px,5vh,48px);display:flex;flex-direction:column;gap:4px}
  .items a,.items button{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:6px 16px 6px 12px;font:inherit;font-size:clamp(19px,1.7vw,23px);font-weight:600;
    color:var(--parch);background:none;border:0;text-align:left;text-decoration:none;cursor:pointer;border-radius:3px;transition:color .12s,background .12s}
  .items .dia{width:12px;height:12px;flex:none;transform:rotate(45deg);border:1.5px solid currentColor;opacity:0;transition:opacity .12s}
  .items a:hover,.items button:hover,.items a:focus-visible,.items button:focus-visible{color:var(--gold-hi)}
  .items a:hover .dia,.items button:hover .dia,.items :focus-visible .dia{opacity:1}
  .items .start{min-height:60px;font-size:clamp(23px,2.1vw,28px);font-weight:700;color:var(--lacquer);background:var(--gold);
    box-shadow:inset 0 0 0 1px #fff4d2,inset 0 0 0 4px var(--gold),inset 0 0 0 5px var(--gold-lo),0 10px 22px -8px #000;margin-bottom:8px}
  .items .start .dia{opacity:1;background:var(--lacquer);border-color:var(--lacquer)}
  .items .start:hover,.items .start:focus-visible{color:var(--lacquer);background:var(--gold-hi)}
  .terms{margin-top:18px;font-size:15px;color:var(--parch-dim)}
  .ver{position:absolute;z-index:3;left:var(--gutter);bottom:18px;font-size:12px;color:#8d8170;font-variant-numeric:tabular-nums}

  /* ---------- how to play ---------- */
  .s-how{background:radial-gradient(120% 80% at 50% 0%,var(--ink-2),var(--lacquer) 70%);display:flex;flex-direction:column;justify-content:center;padding:80px var(--gutter) 56px}
  .s-how .plate{filter:blur(5px) saturate(.85)}
  .s-how .shade{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 55%,#0e0a08a6,#0e0a08e6 80%)}
  .s-how .h2,.hand{position:relative;z-index:2}
  .s-how .h2{text-align:center;font-size:clamp(44px,6.6vw,92px);margin-bottom:clamp(18px,3.5vh,40px)}
  .hand{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,min(300px,33vh)));justify-content:center;gap:clamp(12px,1.8vw,30px)}
  .card{background:var(--parch);color:var(--ink-text);border-radius:6px;padding:7px 7px 14px;
    box-shadow:inset 0 0 0 1px var(--gold-lo),0 14px 28px -10px #000;transform:rotate(var(--r)) translateY(var(--y));transition:transform .25s var(--ease-out)}
  .card:hover{transform:rotate(0) translateY(-10px)}
  .card .art{aspect-ratio:1;overflow:hidden;border-radius:3px;outline:1px solid var(--gold-lo);outline-offset:-1px;background:var(--ink)}
  .card img{width:100%;height:100%;object-fit:cover}
  .card h3{font-family:Chonburi,serif;font-weight:400;font-size:clamp(17px,1.5vw,23px);line-height:1.3;margin:10px 5px 4px;color:var(--verm)}
  .card p{font-size:clamp(14px,1.1vw,16px);line-height:1.5;margin:0 5px;color:var(--ink-soft)}

  /* ---------- word database ---------- */
  .s-words .plate{filter:blur(5px) saturate(.8)}
  .s-words .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0e0a08f0 0%,#0e0a08d6 50%,#0e0a08b3 100%)}
  .words{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:1fr minmax(0,460px);gap:clamp(28px,5vw,80px);align-items:center;
    padding:80px calc(var(--gutter) + 24px) 56px var(--gutter);max-width:1240px;margin:0 auto}
  .words .lead{margin-top:18px;font-size:clamp(18px,1.9vw,22px);line-height:1.55;color:var(--parch);max-width:40ch;text-wrap:pretty}
  .words .big{font-family:Chonburi,serif;font-size:clamp(44px,6.4vw,84px);line-height:1.05;color:var(--gold-hi);display:block;margin:6px 0 8px;font-variant-numeric:tabular-nums}
  .words .players{margin-top:14px;font-size:clamp(16px,1.5vw,18px);font-weight:600;color:var(--gold)}
  .words .note{margin-top:16px;font-size:15px;color:var(--parch-dim);max-width:44ch;line-height:1.6}
  .deck{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:100%;max-width:420px;justify-self:center}
  .deck b{aspect-ratio:1;border-radius:1px;background:#0e0a0899;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 35%,transparent)}
  .deck b.v{background:var(--gold);box-shadow:none}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--parch-dim)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px var(--gold)}
  .legend .lv::before{background:var(--gold);box-shadow:none}

  /* ---------- what's new: latest patch ---------- */
  .s-news .plate{background-position:center 30%}
  .s-news .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0e0a0800 30%,#0e0a08b3 70%)}
  .notes{position:absolute;z-index:2;top:50%;right:calc(var(--gutter) + 24px);transform:translateY(-50%);width:min(560px,calc(100% - 2 * var(--gutter)));
    background:var(--parch);color:var(--ink-text);border-radius:4px;padding:clamp(22px,3vw,36px);box-shadow:inset 0 0 0 1px var(--gold-lo),inset 0 0 0 5px var(--parch),inset 0 0 0 6px #9c733066,0 24px 48px -16px #000}
  .notes .meta{display:flex;gap:12px;align-items:baseline;font-weight:700;color:var(--verm);font-size:15px;font-variant-numeric:tabular-nums}
  .notes h2{font-family:Chonburi,serif;font-weight:400;font-size:clamp(26px,2.8vw,36px);line-height:1.2;margin:6px 0 16px;color:var(--ink-text);text-wrap:balance}
  .notes ul{list-style:none;border-top:1px solid var(--parch-dim)}
  .notes li{padding:10px 0;border-bottom:1px solid var(--parch-dim);font-size:16px;line-height:1.5}
  .notes li b{color:var(--ink-text);margin-right:8px}
  .notes li span{color:var(--ink-soft)}
  .notes .all{display:inline-block;margin-top:16px;font-weight:600;color:var(--verm)}

  /* ---------- coming next: keb-kham's own world ---------- */
  .s-next{background:#faf4e8;color:#2e2620;display:grid;place-items:center;text-align:center;padding:80px var(--gutter) 56px;font-family:Sarabun,sans-serif}
  .s-next .k{font-family:'Baloo Thai 2',sans-serif;font-weight:800;font-size:clamp(76px,15vw,168px);line-height:1;color:#b8400f}
  .s-next p{font-size:clamp(18px,2vw,22px);margin-top:12px;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:32px auto 0;max-width:640px}
  .chips span{font-family:'Baloo Thai 2',sans-serif;color:#fff;font-weight:700;font-size:clamp(18px,1.8vw,22px);padding:8px 22px 6px;border-radius:999px;transform:rotate(var(--r))}
  .soon{display:inline-block;margin-top:34px;font-weight:700;font-size:15px;border:2px solid #2e2620;border-radius:999px;padding:7px 20px}

  .s-promo{background:var(--lacquer);display:grid;place-items:center;text-align:center;padding:80px var(--gutter)}
  .s-promo p{margin-top:14px;font-size:19px;color:var(--parch-dim);max-width:46ch;line-height:1.6}

  /* ---------- footer: plain scrolling text ---------- */
  footer{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--lacquer);border-top:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
  .close{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px var(--gutter) 64px}
  .close .h2{margin-bottom:24px}
  .close .full{width:min(420px,84vw);height:auto;margin-bottom:28px}
  .play{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:60px;min-width:min(300px,100%);padding:0 36px;
    background:var(--gold);color:var(--lacquer);font-weight:700;font-size:21px;text-decoration:none;border-radius:3px;
    box-shadow:inset 0 0 0 1px #fff4d2,inset 0 0 0 4px var(--gold),inset 0 0 0 5px var(--gold-lo),0 10px 22px -8px #000;transition:background .15s}
  .play:hover{background:var(--gold-hi)}
  .play svg,.items svg{width:20px;height:20px;margin-left:auto}
  .play svg{margin-left:0}
  .cols{width:100%;max-width:980px;margin:0 auto;padding:0 var(--gutter) 56px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;line-height:1.75}
  .cols h3{font-family:Chonburi,serif;font-weight:400;font-size:19px;color:var(--gold);margin-bottom:8px}
  .cols p,.cols li{color:var(--parch-dim);font-size:15px;max-width:44ch}
  .cols ul{list-style:none}
  .cols a{color:var(--parch)}
  .cols a:hover{color:var(--gold-hi)}
  .fine{width:100%;max-width:980px;margin:0 auto;padding:20px var(--gutter) 36px;font-size:13px;color:#8d8170;border-top:1px solid #2a1c14}

  .words .big,.words .nw{white-space:nowrap}
  /* short laptop windows: keep the whole menu on screen */
  @media (min-width:761px) and (max-height:720px){
    .logo{width:min(300px,100%)}
    .pitch{margin-top:6px;font-size:17px}
    .items{margin-top:14px;gap:0}
    .items a,.items button{min-height:38px;font-size:18px}
    .items .start{min-height:48px;font-size:21px;margin-bottom:4px}
    .terms{margin-top:8px;font-size:13px}
  }

  /* ---------- phone ---------- */
  @media (max-width:760px){
    .index{top:auto;right:auto;left:50%;bottom:23px;transform:translateX(-50%);flex-direction:row;gap:0}
    .index button{width:44px;height:44px}
    .lang{min-height:44px;padding:6px 16px}
    .cols li a{display:inline-block;padding:9px 0}
    .cue{bottom:8px}
    .cue span{display:none}
    .s-hero .plate{background-position:70% center}
    .s-hero .shade{background:linear-gradient(180deg,#0e0a08e6 0%,#0e0a0800 30%,#0e0a0800 42%,#0e0a08e6 66%,#0e0a08 100%)}
    .fan{top:calc(64px + min(260px,68vw) * .68 + 44px);bottom:176px;left:0;right:0;width:auto}
    .fan{left:16px;right:16px;gap:8px}
    .fan-card{width:min(31cqw,68cqh)}
    .fan-card b{font-size:14px;padding:3px 4px 5px}
    .menu{top:auto;bottom:62px;transform:none;left:16px;right:16px;width:auto}
    .logo-wrap{position:fixed;top:64px;left:0;right:0;text-align:center}
    .logo{width:min(260px,68vw);margin:0 auto}
    .pitch{font-size:17px}
    .items{margin-top:0;gap:0}
    .items a,.items button{min-height:44px;font-size:18px}
    .items .start{min-height:56px;font-size:22px}
    .terms{margin-top:8px;font-size:13px;text-align:center}
    .ver{display:none}
    .s-how{padding:72px 0 64px}
    .s-how .h2{padding:0 16px}
    .hand{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:8px 16px 16px;justify-content:flex-start;scrollbar-width:none}
    .hand::-webkit-scrollbar{display:none}
    .card{flex:0 0 74%;scroll-snap-align:center;--r:0deg !important;--y:0px !important}
    .card h3{font-size:19px}
    .card p{font-size:15px}
    .words{grid-template-columns:1fr;gap:20px;padding:72px 16px 64px;align-content:center}
    .words .note{display:none}
    .words .lead{margin-top:10px;font-size:16px}
    .words .big{font-size:44px}
    .deck{max-width:240px;margin:0 auto;gap:4px}
    .legend{justify-content:center;font-size:12px}
    .notes{top:auto;bottom:64px;right:16px;left:16px;width:auto;transform:none;padding:20px}
    .notes li{font-size:15px;padding:8px 0}
    .notes li:nth-child(n+4){display:none}
    .s-news .shade{background:linear-gradient(180deg,#0e0a0800 0%,#0e0a08 60%)}
    .cols{grid-template-columns:1fr;gap:28px}
  }
</style>
</head>
<body data-tone="dark">

  <a class="mark" href="./" aria-label="ร้อยคำ"><img class="icon" src="brand/icon.svg" alt=""><span class="wm"><img src="brand/web/wordmark.png" alt=""></span><span class="tag" data-i18n="beta"></span></a>

</header>

<script>
(() => {
  const SITE = window.SITE, ST = window.SITE_STATS || {};
  const UI = {
    beta: { th: "เบต้า", en: "BETA" },
    scroll: { th: "เลื่อนลง", en: "Scroll" },
    play: { th: "เล่นเลย", en: "Play now" },
    howH: { th: "วิธีเล่น", en: "How to play" },
    wordsH: { th: "คลังคำ", en: "Word database" },
    newsH: { th: "มีอะไรใหม่", en: "What's new" },
    nextH: { th: "เกมถัดไป", en: "Next game" },
    homeH: { th: "หน้าแรก", en: "Home" },
    sections: { th: "ส่วนของหน้า", en: "Page sections" },
    langTo: { th: "Switch to English", en: "เปลี่ยนเป็นภาษาไทย" },
    wordsTitle: { th: "คลังคำที่โตไปกับผู้เล่น", en: "A word list that grows with its players" },
    wordsLead: { th: "ทุกคำที่คุณเล่นถูกตรวจกับคลังคำไทย", en: "Every word you play is checked against a Thai word list of" },
    wordsUnit: { th: "คำ", en: "words" },
    aiAll: { th: "โมเดล AI ตรวจครบทุกคำแล้ว", en: "An AI model has checked every word" },
    checked: { th: p => `${p}% รู้ชนิดคำแล้ว`, en: p => `${p}% have a known part of speech` },
    unchecked: { th: "ยังไม่รู้ชนิดคำ", en: "part of speech not known yet" },
    players: { th: n => `ผู้เล่นช่วยจัดคำแล้ว ${n} คำ`, en: n => `Players have helped sort ${n} words so far` },
    wordsNote: { th: "คำที่ยังไม่รู้ชนิดคำ เกมจะถามคุณระหว่างเล่นว่าเป็นคำชนิดใด คำตอบของผู้เล่นช่วยให้คลังคำแม่นขึ้น", en: "When you play a word whose part of speech isn't known yet, the game asks what kind of word it is. Players' answers make the list more accurate." },
    allNotes: { th: "บันทึกการอัปเดตทั้งหมด", en: "All patch notes" },
    chips: { th: ["คำนาม", "คำกริยา", "คำวิเศษณ์", "คำบุพบท", "คำสันธาน"], en: ["Nouns", "Verbs", "Adverbs", "Prepositions", "Conjunctions"] },
    soon: { th: "เกมถัดไป · เร็วๆ นี้", en: "Next game · Coming soon" },
    closeH: { th: "ลองเล่นดูสักตา", en: "Try a round" },
    aboutH: { th: "เกี่ยวกับ", en: "About" },
    about: {
      th: "ร้อยคำเป็นเกมการ์ดคำศัพท์ไทยที่ทำคนเดียว เล่นฟรี ไม่ต้องสมัคร ตั้งใจให้การเรียนรู้คำไทยสนุกขึ้น ตอนนี้อยู่ในช่วงเบต้า ความคืบหน้าในเกมอาจถูกรีเซ็ตก่อนเปิดตัวเต็ม",
      en: "Roi-Kham is a Thai word card game made by one person. It's free, needs no sign-up, and is made to make learning Thai words more fun. It's in open beta, so in-game progress may be reset before the full release.",
    },
    contactH: { th: "ติดต่อ", en: "Contact" },
    fb: { th: "เพจ Roi Kham บน Facebook", en: "Roi Kham on Facebook" },
    msg: { th: "ส่งข้อความหาเรา", en: "Send us a message" },
    form: { th: "ส่งความเห็นเกี่ยวกับเกม", en: "Send feedback" },
    privacy: { th: "นโยบายความเป็นส่วนตัว", en: "Privacy" },
    creditsH: { th: "เครดิต", en: "Credits" },
    credits: {
      th: "ฟอนต์ Chonburi, Anuphan, Sarabun, Pridi, Baloo Thai 2 (Google Fonts) · ภาพประกอบสร้างด้วย Midjourney · พัฒนาโดยมี Claude ช่วย",
      en: "Fonts: Chonburi, Anuphan, Sarabun, Pridi, Baloo Thai 2 (Google Fonts) · Art made with Midjourney · Built with help from Claude",
    },
  };
  const CHIPS = [["#b8400f", -3], ["#1f6fb5", 2], ["#6b4fc0", -1.5], ["#c0334f", 2.5], ["#0e7f6d", -2]];
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  let lang = 'th';
  try { if (localStorage.getItem('rk.lang') === 'en') lang = 'en'; } catch (e) {}
  const t = (o, ...a) => typeof o[lang] === 'function' ? o[lang](...a) : o[lang];
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => Number(n).toLocaleString('en-US');
  const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const scene = (key, cls, tone) => { const n = el('section', 'scene ' + cls); n.dataset.key = key; n.dataset.tone = tone; return n; };

  // ---------- sections ----------
  const builders = {
    promo: s => { const n = scene('promo', 's-promo', 'dark');
      n.render = () => { n.innerHTML = `<div class="rule"></div><div><h2 class="h2" data-land>${esc(t(s.title))}</h2><p>${esc(t(s.body))}</p></div>`; }; return n; },

    hero: () => { const H = SITE.hero, n = scene('hero', 's-hero', 'dark');
      n.render = () => { n.innerHTML = `<div class="plate" style="background-image:url(${H.bg})"></div><div class="shade"></div><div class="rule"></div>
        <div class="fan" aria-hidden="true">${H.cards.map((c, i) => `<div class="fan-card" style="--i:${i - 1};--hue:${c.hue}"><img src="${c.art}" alt="" decoding="async"><b>${esc(c.name)}</b></div>`).join('')}</div>
        <div class="menu">
          <div class="logo-wrap"><h1 class="logo" data-land><img src="brand/web/logo.png" alt="ร้อยคำ ROI-KHAM" decoding="async"></h1><p class="pitch">${esc(t(H.pitch))}</p></div>
          <ul class="items">
            <li><a class="start" href="${esc(SITE.links.play)}"><span class="dia"></span>${t(UI.play)}${ARROW}</a></li>
          </ul>
          <p class="terms">${esc(t(H.terms))}</p>
        </div>
        <p class="ver">${esc(SITE.version)} · beta</p>`; }; return n; },

    how: () => { const n = scene('how', 's-how', 'dark');
      const tilt = [[-4, 10], [-1.5, 0], [1.5, 0], [4, 10]];
      n.render = () => { n.innerHTML = `<div class="plate" style="background-image:url(art/theatre.webp)"></div><div class="shade"></div><div class="rule"></div><h2 class="h2" data-land>${t(UI.howH)}</h2><ol class="hand">${
        SITE.steps.map((s, i) => `<li class="card" style="--r:${tilt[i % 4][0]}deg;--y:${tilt[i % 4][1]}px">
          <div class="art"><img src="${s.art}" alt="" decoding="async"></div>
          <h3>${esc(t(s.title))}</h3><p>${esc(t(s.text))}</p></li>`).join('')}</ol>`; }; return n; },

    words: () => { const n = scene('words', 's-words', 'dark'), pct = ST.verifiedPct;
      n.render = () => { n.innerHTML = `<div class="plate" style="background-image:url(art/archive.webp)"></div><div class="shade"></div><div class="rule"></div>
        <div class="words"><div><h2 class="h2" data-land>${t(UI.wordsTitle)}</h2>
          <p class="lead">${t(UI.wordsLead)}<span class="big">${fmt(ST.total)} ${t(UI.wordsUnit)}</span>${t(UI.aiAll)} · <span class="nw">${t(UI.checked, pct)} (${fmt(ST.verified)} ${t(UI.wordsUnit)})</span></p>
          ${ST.players ? `<p class="players">${t(UI.players, fmt(ST.players))}</p>` : ''}
          <p class="note">${t(UI.wordsNote)}</p></div>
        <div><div class="deck" role="img" aria-label="${t(UI.checked, pct)}">${Array.from({ length: 100 }, (_, i) => `<b${i < pct ? ' class="v"' : ''}></b>`).join('')}</div>
          <div class="legend"><span class="lv">${t(UI.checked, pct)}</span><span>${t(UI.unchecked)}</span></div></div></div>`; };
      return n; },

    news: () => { const P = SITE.patch, n = scene('news', 's-news', 'dark');
      n.render = () => { n.innerHTML = `<div class="plate" style="background-image:url(${P.art})"></div><div class="shade"></div><div class="rule"></div>
        <article class="notes"><p class="meta"><span>${esc(P.version)}</span><time datetime="${P.date}">${fmtDate(P.date)}</time></p>
          <h2 data-land>${esc(t(P.title))}</h2>
          <ul>${P.items.map(i => `<li><b>${esc(t(i.head))}</b><span>${esc(t(i.text))}</span></li>`).join('')}</ul>
          <a class="all" href="${esc(SITE.links.patchNotes)}" target="_blank" rel="noopener">${t(UI.allNotes)}</a></article>`; };
      return n; },

    next: () => { const N = SITE.next, n = scene('next', 's-next', 'light');
      n.render = () => { n.innerHTML = `<div><h2 class="k" data-land>${esc(N.name)}</h2><p>${esc(t(N.desc))}</p>
        <div class="chips">${t(UI.chips).map((c, i) => `<span style="background:${CHIPS[i][0]};--r:${CHIPS[i][1]}deg">${c}</span>`).join('')}</div>
        <span class="soon">${t(UI.soon)}</span></div>`; };
      return n; },
  };

  const stage = document.getElementById('stage');
  const order = (SITE.promo ? ['promo'] : []).concat(['hero', 'how', 'words', 'news', 'next']);
  const scenes = order.map(k => { const n = builders[k](SITE.promo); stage.append(n); return n; });

  const index = document.getElementById('index');
  const NAMES = { hero: UI.homeH, how: UI.howH, words: UI.wordsH, news: UI.newsH, next: UI.nextH };
  const sceneName = i => order[i] === 'promo' ? t(SITE.promo.title) : t(NAMES[order[i]]);
  function renderLinks() {
    const L = SITE.links, items = [[L.facebook, UI.fb], [L.messenger, UI.msg]];
    if (L.feedbackForm) items.push([L.feedbackForm, UI.form]);
    items.push([L.privacy, UI.privacy]);
    document.getElementById('links').innerHTML = items.map(([href, label]) =>
      `<li><a href="${esc(href)}"${href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${t(label)}</a></li>`).join('');
  }
  function renderAll() {
    document.documentElement.lang = lang;
    const lb = document.getElementById('lang');
    lb.textContent = lang === 'th' ? 'EN' : 'TH';
    lb.setAttribute('aria-label', t(UI.langTo)); lb.lang = lang === 'th' ? 'en' : 'th';
    index.setAttribute('aria-label', t(UI.sections));
    [...index.children].forEach((b, i) => b.setAttribute('aria-label', sceneName(i)));
    document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(UI[e.dataset.i18n]));
    scenes.forEach(s => s.render());
    const p2 = document.getElementById('play2');
    p2.href = SITE.links.play; p2.innerHTML = `${t(UI.play)}${ARROW}`;
    renderLinks();
  }
  document.getElementById('lang').onclick = () => {
    lang = lang === 'th' ? 'en' : 'th';
    try { localStorage.setItem('rk.lang', lang); } catch (e) {}
    renderAll();
  };
  renderAll();

  // Live count of player answers (content.js liveCount); the line stays hidden if this fails.
  const LC = SITE.liveCount;
  if (LC) fetch(LC.url, { method: 'POST', headers: { apikey: LC.key, 'Content-Type': 'application/json' }, body: '{}' })
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.words > 0) { ST.players = d.words; scenes[order.indexOf('words')].render(); } })
    .catch(() => {});

  // ---------- Jazz Whip ----------
  const root = document.documentElement, body = document.body, streak = document.getElementById('streak');
  const cue = document.getElementById('cue');
  const WHIP_MS = 80, COOLDOWN = 250;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let idx = 0, busy = false, inFooter = false;

  scenes.forEach((s, i) => { const b = el('button'); b.type = 'button'; b.setAttribute('aria-label', sceneName(i));
    b.onclick = () => { if (!busy && !inFooter && i !== idx) whipTo(i); }; index.append(b); });
  const paint = () => {
    [...index.children].forEach((d, i) => { d.classList.toggle('on', i === idx && !inFooter); d.setAttribute('aria-current', i === idx && !inFooter ? 'true' : 'false'); });
    body.dataset.tone = inFooter ? 'dark' : scenes[idx].dataset.tone;
    body.dataset.scene = inFooter ? 'footer' : scenes[idx].dataset.key;
    cue.style.opacity = !inFooter && idx < scenes.length - 1 ? 1 : 0;
    index.style.opacity = inFooter ? 0 : 1;
  };
  scenes[0].classList.add('on'); paint(); root.classList.add('locked');

  // headings land hard: a 2% overshoot right after the camera stops
  const land = sc => { if (reduced) return; sc.querySelectorAll('[data-land]').forEach(h => h.animate(
    [{ transform: 'scale(1.06)', opacity: .6 }, { transform: 'scale(.98)', opacity: 1, offset: .55 }, { transform: 'scale(1)' }],
    { duration: 220, easing: 'cubic-bezier(.2,.9,.3,1)' })); };

  function whipTo(next) {
    busy = true;
    const out = scenes[idx], inn = scenes[next], s = next > idx ? 1 : -1; // down = clockwise
    inn.classList.add('on');
    const ease = 'cubic-bezier(.75,0,.25,1)';
    let a, b;
    if (reduced) {
      a = out.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
      b = inn.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
    } else {
      a = out.animate([
        { transform: 'translateX(0) rotateY(0) skewX(0)', filter: 'blur(0)' },
        { transform: `translateX(${-60 * s}%) rotateY(${18 * s}deg) skewX(${-10 * s}deg)`, filter: 'blur(14px)', offset: .5 },
        { transform: `translateX(${-120 * s}%) rotateY(${30 * s}deg) skewX(${-14 * s}deg)`, filter: 'blur(24px)' }
      ], { duration: WHIP_MS, easing: ease, fill: 'forwards' });
      b = inn.animate([
        { transform: `translateX(${120 * s}%) rotateY(${-30 * s}deg) skewX(${-14 * s}deg)`, filter: 'blur(24px)' },
        { transform: `translateX(${60 * s}%) rotateY(${-18 * s}deg) skewX(${-10 * s}deg)`, filter: 'blur(14px)', offset: .5 },
        { transform: `translateX(${-2 * s}%) rotateY(0) skewX(${2 * s}deg)`, filter: 'blur(0)', offset: .88 },
        { transform: 'translateX(0) rotateY(0) skewX(0)', filter: 'blur(0)' }
      ], { duration: WHIP_MS * 1.08, easing: ease, fill: 'forwards' });
      streak.animate([{ opacity: 0 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: WHIP_MS, easing: ease });
    }
    b.onfinish = () => {
      out.classList.remove('on'); a.cancel(); b.cancel();
      idx = next; paint(); land(inn);
      setTimeout(() => busy = false, COOLDOWN); // stops trackpad inertia firing twice
    };
  }
  function go(dir) {
    if (busy || inFooter) return;
    const next = idx + dir;
    if (next >= 0 && next < scenes.length) return whipTo(next);
    if (dir > 0) { // past the last section: release into normal scrolling
      inFooter = true; root.classList.remove('locked'); paint();
      document.getElementById('footer').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });
    }
  }
  function relock() { inFooter = false; scrollTo(0, 0); root.classList.add('locked'); paint(); }

  // main-menu items jump straight to their section
  stage.addEventListener('click', e => {
    if (busy) { e.preventDefault(); return; }
    const g = e.target.closest('[data-go]');
    if (g) { const i = scenes.findIndex(s => s.dataset.key === g.dataset.go); if (i > -1 && i !== idx) whipTo(i); }
  }, true);

  let acc = 0, accT = 0;
  addEventListener('wheel', e => {
    if (inFooter) { if (e.deltaY < 0 && scrollY <= 0) { e.preventDefault(); relock(); } return; }
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && e.target.closest('.hand')) return; // sideways scroll through the cards
    e.preventDefault();
    const now = performance.now();
    if (now - accT > 200) acc = 0;
    accT = now; acc += e.deltaY;
    if (Math.abs(acc) > 40) { go(Math.sign(acc)); acc = 0; }
  }, { passive: false });
  addEventListener('scroll', () => { if (inFooter && scrollY <= 0) relock(); });

  let tx = null, ty = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', e => {
    if (inFooter || ty === null) return;
    const dx = Math.abs(e.touches[0].clientX - tx), dy = Math.abs(e.touches[0].clientY - ty);
    if (dx > dy && e.target.closest('.hand')) return; // let the card row swipe sideways
    e.preventDefault();
  }, { passive: false });
  addEventListener('touchend', e => {
    if (ty === null || inFooter) return;
    const dx = tx - e.changedTouches[0].clientX, dy = ty - e.changedTouches[0].clientY; tx = ty = null;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) go(Math.sign(dy));
  });
  addEventListener('keydown', e => {
    if (inFooter) return;
    if (['ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.target.closest('a,button'))) { e.preventDefault(); go(1); }
    if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  });
})();
</script>
</body>
</html>
